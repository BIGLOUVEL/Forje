<script>
(async () => {
  const files = [
    'forje-atoms.jsx',
    'forje-hero.jsx',
    'forje-live.jsx',
    'forje-sections.jsx',
    'forje-tweaks.jsx',
    'forje-app.jsx',
    'app-shell.jsx',
    'app-dashboard.jsx',
    'app-screens.jsx',
    'app-blaise.jsx',
    'app-sources.jsx',
    'app-onboarding.jsx',
    'app-main.jsx',
    'app-auth.jsx',
    'root.jsx',
  ];

  const V = '?v=56';

  // Cache du JSX compilé : Babel (~2 Mo de JS) n'est chargé et exécuté que si
  // un fichier manque au cache — les visites suivantes démarrent instantanément.
  // Désactivé en local : en dev on modifie les JSX sans bumper V.
  const CACHE = 'forje-jsx:';
  const useCache = location.hostname !== 'localhost' && location.hostname !== '127.0.0.1';
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CACHE) && !k.endsWith(V)) localStorage.removeItem(k);
    }
  } catch (e) {}

  let babelReady = null;
  const ensureBabel = () => {
    if (window.Babel) return Promise.resolve();
    if (!babelReady) {
      babelReady = new Promise((ok, err) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
        s.integrity = 'sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y';
        s.crossOrigin = 'anonymous';
        s.onload = ok; s.onerror = err;
        document.head.appendChild(s);
      });
    }
    return babelReady;
  };

  // Fetch + compilation en PARALLÈLE (l'ancienne boucle await séquentielle
  // faisait 14 allers-retours réseau en cascade au premier chargement),
  // puis exécution dans l'ordre — les fichiers dépendent des précédents.
  const compiled = await Promise.all(files.map(async (src) => {
    try {
      const key = CACHE + src + V;
      let code = null;
      if (useCache) { try { code = localStorage.getItem(key); } catch (e) {} }
      if (!code) {
        const res  = await fetch(src + V);
        const jsx  = await res.text();
        await ensureBabel();
        code = Babel.transform(jsx, { presets: ['react'] }).code;
        if (useCache) { try { localStorage.setItem(key, code); } catch (e) { /* quota : on compile à chaque fois */ } }
      }
      return { src, code };
    } catch (e) {
      console.error(`[Forje] Erreur chargement ${src}:`, e);
      return null;
    }
  }));
  for (const item of compiled) {
    if (!item) continue;
    const el = document.createElement('script');
    el.text = `(function(){\n${item.code}\n})();`;
    document.head.appendChild(el);
  }

  // Deep-link : le contenu arrive après le load → on rejoue l'ancre de l'URL
  if (location.hash) {
    setTimeout(() => {
      try { document.querySelector(location.hash)?.scrollIntoView(); } catch (e) {}
    }, 900);
  }
})();
</script>
